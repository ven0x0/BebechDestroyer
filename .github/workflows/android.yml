name: BebechDestroyer

on:
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: master-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test the journal, updater and release pipeline
        run: node --test tests/*.test.cjs ci/*.test.mjs
      - name: Test workout and import flows in Chrome
        env:
          ROZSTAW_BROWSER: /usr/bin/google-chrome
        run: node tests/qa-browser.cjs
      - name: Set up Android SDK
        run: bash ci/android-sdk.sh
      - name: Run Android tests, lint and builds
        run: |
          JAVA_HOME="$JAVA_HOME_17_X64" bash gradlew --no-daemon \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease

  unsigned:
    name: unsigned-android
    needs: tests
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Android SDK
        run: bash ci/android-sdk.sh
      - name: Build the APK for the verified commit and channel
        run: |
          changes=$(git rev-list --first-parent --count "$GITHUB_SHA")
          code=$((1000 + changes))
          version="1.3.$changes"
          printf '<resources><string name="update_repository" translatable="false">%s</string></resources>\n' \
            "$GITHUB_REPOSITORY" > app/src/main/res/values/update_channel.xml
          JAVA_HOME="$JAVA_HOME_17_X64" bash gradlew --no-daemon \
            "-PreleaseVersionCode=$code" "-PreleaseVersionName=$version" :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          manifest=$("$tools/aapt" dump badging "$apk")
          grep -Fq "package: name='pl.rozstaw.app' versionCode='$code' versionName='$version'" <<< "$manifest"
          "$tools/zipalign" -c -P 16 4 "$apk"
          if "$tools/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "Expected an unsigned APK." >&2
            exit 1
          fi
      - name: Check for an existing artifact on retry
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="unsigned-android-$GITHUB_SHA"
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$asset" --jq '[.artifacts[] | select(.expired == false)] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Upload unsigned APK for local signing
        if: steps.artifact.outputs.count == '0'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unsigned-android-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 30
