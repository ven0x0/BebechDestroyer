plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.rozstaw.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'pl.rozstaw.app'
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('releaseVersionCode').orElse('4').get().toInteger()
        versionName providers.gradleProperty('releaseVersionName').orElse('1.3').get()
    }
}
