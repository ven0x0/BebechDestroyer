<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#101210" />
    <title>BebechDestroyer — dziennik treningowy</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="training.css" />
    <link rel="stylesheet" href="atlas.css" />
    <link rel="stylesheet" href="progress.css" />
    <link rel="stylesheet" href="calendar.css" />
    <link rel="stylesheet" href="demos.css" />
    <link rel="stylesheet" href="distribution.css" />
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <defs>
        <linearGradient id="atlas-body-shade" x2="1" y2="0" gradientUnits="objectBoundingBox">
          <stop stop-color="#65717d"/><stop offset=".55" stop-color="#a8afb5"/><stop offset="1" stop-color="#828c95"/>
        </linearGradient>
        <radialGradient id="atlas-muscle-shade" cx="45%" cy="38%" r="76%">
          <stop stop-color="#c6ccd1"/><stop offset=".65" stop-color="#aab2b8"/><stop offset="1" stop-color="#7b858d"/>
        </radialGradient>
      </defs>
    </svg>
    <a class="skip" href="#content">Przejdź do treści</a>
    <div id="shell">
      <aside id="rail"></aside>
      <div id="stage">
        <header id="topbar"></header>
        <main id="content" tabindex="-1"></main>
      </div>
      <nav id="bottom" aria-label="Dolna nawigacja"></nav>
    </div>
    <div id="overlay" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="backup-file" accept=".json,application/json" hidden />
    <script src="i18n.js"></script>
    <script src="library.js"></script>
    <script src="model.js"></script>
    <script src="analytics.js"></script>
    <script src="atlas.js"></script>
    <script src="live.js"></script>
    <script src="movement.js"></script>
    <script src="demos.js"></script>
    <script src="technique.js"></script>
    <script src="calendar.js"></script>
    <script src="routines.js"></script>
    <script src="training.js"></script>
    <script src="app.js"></script>
    <script src="progress.js"></script>
    <script src="screens.js"></script>
  </body>
</html>
